[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basp-dataflow"
version = "0.3.0"
description = "BASP adaptive dataflow engine: topology-aware simulator, scheduler and low-bit reference kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.16.9", "gguf>=0.10"]  # gguf: reference reader, cross-checks our header reader

[tool.setuptools.packages.find]
include = ["basp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
