[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basp-dataflow"
version = "0.5.0"
description = "BASP adaptive dataflow engine: evidence-gated simulator, scheduler, memory domains and a verified GGUF runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.16.9", "gguf>=0.10"]  # gguf: reference reader, cross-checks our header reader
verify = ["torch>=2.1", "transformers>=4.51"]  # the reference for runtime parity (tests/test_v04_verification.py)

[tool.setuptools.packages.find]
include = ["basp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
